<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI System Design — Interview Scenarios with Snowflake Builds</title>
  <meta name="description" content="AI system design interview questions with structured answers, architecture diagrams and Snowflake implementations.">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/case.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation">&#9776;</button>
    <a href="#/" class="brand">
      <span class="brand-mark">AI</span>
      <span class="brand-text">System Design <small>Case studies &middot; Interview Q&amp;A &middot; Snowflake builds</small></span>
    </a>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Search questions, topics, tags…  ( / )" autocomplete="off">
    </div>
    <div class="top-actions">
      <label class="toggle" title="Hide answers until you reveal them">
        <input type="checkbox" id="practiceToggle">
        <span>Practice mode</span>
      </label>
      <div class="progress-pill" id="progressPill" title="Questions marked as studied">0 / 0</div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">&#9680;</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Questions"></nav>
    <main class="content" id="app" tabindex="-1"></main>
  </div>

  <!-- content: sections first, then one file per section (order = site order) -->
  <script src="data/sections.js"></script>
  <script src="data/rag.js"></script>
  <script src="data/agents.js"></script>
  <script src="data/inference.js"></script>
  <script src="data/platform.js"></script>
  <script src="data/agent-identity.js"></script>
  <script src="data/production.js"></script>
  <script src="data/eval.js"></script>
  <script src="data/case-studies.js"></script>
  <script src="data/case-agent-platform.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
